name: 오늘의 단어·챌린지 출제

on:
  schedule:
    - cron: '0 14 * * *' # 매일 KST 23:00 (UTC 14:00) — 밤 11시에 익일 단어 출제
  workflow_dispatch: # 수동 실행 — word에 wordId/name 입력 시 그 단어로 강제 출제
    inputs:
      word:
        description: '강제 출제할 단어 id 또는 이름 (비우면 랜덤)'
        required: false
        type: string
      challenge:
        description: '챌린지 강제 출제 — "단어" 또는 "단어 YYYY-MM-DD" (비우면 랜덤 버퍼만)'
        required: false
        type: string

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: 오늘의 단어 선정 및 Firestore 기록
        run: node scripts/pickDailyWord.js ${{ inputs.word }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 챌린지 단어 선정 및 Firestore 기록
        run: node scripts/pickChallengeWord.js ${{ inputs.challenge }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
