<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#315d7f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bible Link">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Bible Link">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="ICON.png">
  <link rel="apple-touch-icon" href="ICON.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; position: fixed; overflow: hidden; overscroll-behavior: none; background: #f6f8fb; }
    #root { width: min(100%, 480px); height: min(100dvh, calc(min(100vw, 480px) * 20 / 9)); margin: 0 auto; overflow: hidden; background: #f6f8fb; }
    @media (max-width: 480px) {
      html, body { position: static; height: auto; min-height: 100%; overflow: auto; }
      #root { height: min(100dvh, calc(100vw * 20 / 9)); overflow: hidden; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
